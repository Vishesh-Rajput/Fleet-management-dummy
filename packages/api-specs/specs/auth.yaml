openapi: 3.1.0
info:
  title: Auth Service API
  version: 0.1.0
  description: Authentication and token issuing.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /auth/login:
    post:
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
        '401':
          $ref: '../shared/common.yaml#/components/responses/Unauthorized'
  /auth/me:
    get:
      summary: Current user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
        '401':
          $ref: '../shared/common.yaml#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      $ref: '../shared/common.yaml#/components/securitySchemes/bearerAuth'